# Stage 1: residual PPO, left hand, cubes only, objective = "don't let it fall".
# Everything the actor sees is in obs_mode "full" (includes object pose).

name: residual_cube
seed: 0

env:                         # passed to orca_sim.OrcaHandGrasp
  side: left
  obs_mode: full             # full | proprio
  objects: cubes             # set from orca_sim/grasp_objects.py OBJECT_SETS, or a list of names
  object_mass: [0.02, 0.15]  # kg, sampled per episode
  object_friction: [0.5, 1.2]
  object_xy_jitter: 0.005    # m, random shift of the start position
  reward_weights:            # all other terms (table_contact, self_contact, grip_force, joint_limit) stay 0
    reach: 0.5
    hold: 1.0
    drop: -10.0
    success: 10.0
    action_rate: -0.01

residual:
  scale: 0.3                 # rad: max correction per joint on top of the scripted grasp
  close_steps: 80            # scripted grasp closes over 0.8 s

training:
  n_envs: 16
  total_timesteps: 3_000_000
  normalize_obs: true
  normalize_reward: true
  eval_every: 100_000
  eval_episodes: 32
  torch_threads: 4           # threads for the network update (envs use their own processes)

ppo:
  n_steps: 250               # per env per update (= one episode); 16 envs -> 4000 samples/update
  batch_size: 1000
  n_epochs: 5
  learning_rate: 3.0e-4
  gamma: 0.99
  gae_lambda: 0.95
  clip_range: 0.2
  ent_coef: 0.0
  target_kl: 0.03
  policy_kwargs:
    log_std_init: -1.0       # start with small exploration noise (std ~0.37 -> ~0.11 rad)
    net_arch: {pi: [256, 256], vf: [256, 256]}
    activation_fn: ELU

# No curriculum yet. Later, e.g.:
# curriculum:
#   - {min_success: 0.85, weights: {grip_force: -0.01}}
#   - {min_success: 0.85, weights: {grip_force: -0.03, table_contact: -0.05}}
